[alembic]
script_location = alembic
prepend_sys_path = .
# Fallback only — env.py always overrides this from application settings
# (CHRONOBEAM_DATABASE_URL or the non-secret dev default).
sqlalchemy.url = postgresql+psycopg://chronobeam:chronobeam_dev_only@127.0.0.1:55432/chronobeam

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S